name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_suffix: linux-amd64
            goarch: amd64
            cc: gcc
            apt_packages: gcc
          - asset_suffix: linux-386
            goarch: "386"
            cc: gcc -m32
            apt_packages: gcc-multilib
          - asset_suffix: linux-arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - asset_suffix: linux-armv7
            goarch: arm
            goarm: "7"
            cc: arm-linux-gnueabihf-gcc
            apt_packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt_packages }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/ha-ev-charging-bridge-${{ matrix.asset_suffix }}" .

      - name: Package asset
        run: |
          tar -C dist -czf "dist/ha-ev-charging-bridge-${{ matrix.asset_suffix }}.tar.gz" "ha-ev-charging-bridge-${{ matrix.asset_suffix }}"
          sha256sum "dist/ha-ev-charging-bridge-${{ matrix.asset_suffix }}.tar.gz" > "dist/ha-ev-charging-bridge-${{ matrix.asset_suffix }}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-ev-charging-bridge-${{ matrix.asset_suffix }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add installer asset
        run: cp install.sh dist/install.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/install.sh
          generate_release_notes: true
