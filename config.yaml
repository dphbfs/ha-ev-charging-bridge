name: Home Assistant EV Charging Bridge
slug: ha_ev_charging_bridge
version: "0.1.2-poc"
description: Detects EV charging sessions from Home Assistant entity updates
url: https://github.com/dphbfs/ha-ev-charging-bridge
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.21
  amd64: ghcr.io/home-assistant/amd64-base:3.21
  armhf: ghcr.io/home-assistant/armhf-base:3.21
  armv7: ghcr.io/home-assistant/armv7-base:3.21
  i386: ghcr.io/home-assistant/i386-base:3.21
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: EV Charging
homeassistant_api: true
options:
  smart_plug_device: switch.charger_plug
  smart_plug_power: sensor.charger_plug_current_consumption
  smart_plug_energy_kwh: sensor.car_charger_energy
  smart_plug_voltage: sensor.charger_plug_voltage
schema:
  smart_plug_device: match(^[a-z0-9_]+\.[a-z0-9_]+$)
  smart_plug_power: match(^sensor\.[a-z0-9_]+$)
  smart_plug_energy_kwh: match(^sensor\.[a-z0-9_]+$)
  smart_plug_voltage: match(^sensor\.[a-z0-9_]+$)
