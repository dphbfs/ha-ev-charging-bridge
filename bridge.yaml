home_assistant:
  url: ${HA_URL}
  token: ${HA_TOKEN}
  event_types:
    - state_changed

ha_entities:
  smart_plug:
    device: &smart_plug_device switch.charger_plug
    power: &smart_plug_power sensor.charger_plug_current_consumption
    energy_kwh: &smart_plug_energy_kwh sensor.charger_energy
    voltage: &smart_plug_voltage sensor.charger_voltage

chargers:
  - charger_id: charger-1
    charger_name: Example EV charger
    evse_id: evse-1
    connector_id: connector-1
    meter_id: meter-1
    entities:
      power_w: *smart_plug_power
      energy_kwh: *smart_plug_energy_kwh
      availability: *smart_plug_device
      plug: *smart_plug_device
    availability:
      entity_id: *smart_plug_device
      available_state: "on"
      unavailable_state: "off"
      unavailable_after: 2m
    start:
      type: power_threshold
      entity_id: *smart_plug_power
      threshold_w: 200
      duration: 10s
    stop:
      - type: power_threshold
        entity_id: *smart_plug_power
        threshold_w: 50
        duration: 10s
      - type: device_offline
        entity_id: *smart_plug_device
        state: "off"
        duration: 10s
    meters:
      - meter_id: meter-1
        entity_id: *smart_plug_power
        unit: W
        aggregation: average
        outside_session_storage: drop
      - meter_id: meter-1
        entity_id: *smart_plug_energy_kwh
        unit: kWh
        aggregation: last
        outside_session_storage: drop

retention:
  meter_values: 90d
  lifecycle_events: 365d
  raw_events: 7d
